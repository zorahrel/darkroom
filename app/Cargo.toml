[package]
name = "darkroom-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Darkroom come applicazione desktop: la stessa interfaccia della versione web, col motore nello stesso processo."

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
darkroom-core = { path = "../core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
